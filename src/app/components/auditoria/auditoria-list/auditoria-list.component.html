<div class="container mx-auto px-4">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-primary-800">Auditoria</h1>
    </div>

    <div class="grid gap-4 container px-4">
      <div class="bg-white shadow-md rounded-lg p-4 flex items-center justify-evenly mb-6">
        <div>
          <label for="fecha">Fecha</label>
          <input 
            type="date" 
            id="fecha"
            class="w-full px-3 py-2 border border-secondary-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
            [(ngModel)]="filtroFecha" />
        </div>
        <div>
          <label for="usuarios">Usuarios</label>
          <select
          id="usuarios"
          class="w-full px-3 py-2 border border-secondary-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
            [(ngModel)]="filtroUsuario">
              <option value="">Todos</option>
              <option *ngFor="let u of usuarios" [value]="u">{{ u }}</option>
  
          </select>
        </div>
        
      
        <button (click)="filtrar()" class="px-4 py-2 bg-primary-600 text-white rounded-md shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500">Buscar</button>
      </div>
    </div>
  
    <!-- Loading Indicator -->
    <div *ngIf="loading" class="flex justify-center my-8">
      <svg class="animate-spin h-8 w-8 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>
  
    <!-- User List -->
    <div *ngIf="!loading" class="max-h-lvh overflow-y-scroll">
      <div *ngIf="auditoriasFiltradas.length === 0" class="bg-white rounded-lg shadow-md p-8 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-secondary-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <h3 class="mt-4 text-lg font-medium text-secondary-900">No se encontro auditoria</h3>
        <p class="mt-2 text-secondary-600">Intenta con otra búsqueda.</p>
      </div>
  
      <div *ngIf="listado.length > 0" class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="min-w-full divide-y divide-secondary-200">
          <thead class="bg-secondary-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-secondary-500 uppercase tracking-wider whitespace-nowrap">
                Fecha
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-secondary-500 uppercase tracking-wider whitespace-nowrap">
                Accion
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-secondary-500 uppercase tracking-wider">
                Descripcion
              </th>
              <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-secondary-500 uppercase tracking-wider whitespace-nowrap">
                Usuario
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-secondary-200">
            <tr *ngFor="let auditoria of auditoriasFiltradas" class="hover:bg-secondary-50">
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="font-medium text-secondary-900">{{ formatearFecha(auditoria.fecha) }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-secondary-900">{{ auditoria.accion }}</div>
              </td>
              <td class="px-6 py-4 max-w-md">
                <div class="text-secondary-900">{{ auditoria.nuevoValor }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-secondary-900">{{ auditoria.usuario }}</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
